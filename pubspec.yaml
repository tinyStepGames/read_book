name: read_book
description: "A personal novel reader app."
publish_to: 'none'
version: 1.0.6+7


environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  html: ^0.15.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  flutter_local_notifications: ^17.0.0
  intl: ^0.19.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.6
  archive: ^3.6.1
  file_picker: ^11.0.2
  share_plus: ^12.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
