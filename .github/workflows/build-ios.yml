name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build unsigned iOS application
        run: flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Payload read_book.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -q -r read_book.ipa Payload
          rm -rf Payload

          test -s read_book.ipa
          shasum -a 256 read_book.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: read-book-ipa
          path: read_book.ipa
          if-no-files-found: error
          retention-days: 7
